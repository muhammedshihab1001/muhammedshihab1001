  <text x="640" y="120" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" fill="#111111">Full-stack and AI engineer at Vizaido. I build</text><text x="640" y="148" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" fill="#111111">production web platforms end to end: LLM</text><text x="640" y="176" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" fill="#111111">agents with strong guardrails, payment-safe</text><text x="640" y="204" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" fill="#111111">backends and well-monitored services.</text><text x="640" y="252" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" fill="#6b675e">Self-taught. I moved from finance and</text><text x="640" y="280" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" fill="#6b675e">taxation into software, and I still build</text><text x="640" y="308" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" fill="#6b675e">machine learning and data projects in public.</text><text x="640" y="336" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" fill="#6b675e">Currently learning: Go, agent engineering.</text>
