<svg width="100%" viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-label="What I do: AI agents, backend and APIs, frontend, security, cloud and releases, observability and data.">
  <defs></defs>
  <rect width="1200" height="600" fill="#efece4"/>
  <text x="24" y="38" font-family="'JetBrains Mono','IBM Plex Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="14" fill="#111111">03 — WHAT I DO</text>
  <text x="1176" y="38" text-anchor="end" font-family="'JetBrains Mono','IBM Plex Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="14" fill="#111111">P. 03</text>
  <line x1="0" y1="56" x2="1200" y2="56" stroke="#111111" stroke-width="1.5"/>
  <text x="24" y="128" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="46" font-weight="900" fill="#111111" letter-spacing="-1">What I do<tspan fill="#ff3b1f">.</tspan></text>
  <line x1="0" y1="158" x2="1200" y2="158" stroke="#111111" stroke-width="1.5"/>
  <text x="24.0" y="210" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="44" font-weight="900" fill="#ff3b1f" letter-spacing="-1">01</text><text x="94.0" y="208" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="19" font-weight="800" fill="#111111">AI AGENTS</text><text x="94.0" y="236" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15.5" fill="#111111">Tool-using LLM agents with</text><text x="94.0" y="258" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15.5" fill="#111111">allow-lists, hard limits and</text><text x="94.0" y="280" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15.5" fill="#111111">human approval. Prompt-injection</text><text x="94.0" y="302" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15.5" fill="#111111">defence and red-team tests.</text><line x1="408.0" y1="174" x2="408.0" y2="342" stroke="#111111"/><text x="424.0" y="210" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="44" font-weight="900" fill="#111111" letter-spacing="-1">02</text><text x="494.0" y="208" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="19" font-weight="800" fill="#111111">BACKEND &amp; APIS</text><text x="494.0" y="236" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15.5" fill="#111111">Versioned REST APIs, idempotent</text><text x="494.0" y="258" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15.5" fill="#111111">webhooks and payments, ACID</text><text x="494.0" y="280" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15.5" fill="#111111">ledgers, background jobs with</text><text x="494.0" y="302" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15.5" fill="#111111">leases and outbox patterns.</text><line x1="792.0" y1="174" x2="792.0" y2="342" stroke="#111111"/><text x="808.0" y="210" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="44" font-weight="900" fill="#111111" letter-spacing="-1">03</text><text x="878.0" y="208" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="19" font-weight="800" fill="#111111">FRONTEND</text><text x="878.0" y="236" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15.5" fill="#111111">React and Next.js apps tuned</text><text x="878.0" y="258" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15.5" fill="#111111">for Core Web Vitals and WCAG</text><text x="878.0" y="280" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15.5" fill="#111111">accessibility, with design</text><text x="878.0" y="302" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15.5" fill="#111111">tokens, themes and dark mode.</text><text x="24.0" y="400" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="44" font-weight="900" fill="#111111" letter-spacing="-1">04</text><text x="94.0" y="398" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="19" font-weight="800" fill="#111111">SECURITY</text><text x="94.0" y="426" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15.5" fill="#111111">Role-based access, step-up</text><text x="94.0" y="448" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15.5" fill="#111111">auth, session revocation,</text><text x="94.0" y="470" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15.5" fill="#111111">security headers and</text><text x="94.0" y="492" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15.5" fill="#111111">secret scanning.</text><line x1="408.0" y1="364" x2="408.0" y2="532" stroke="#111111"/><text x="424.0" y="400" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="44" font-weight="900" fill="#111111" letter-spacing="-1">05</text><text x="494.0" y="398" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="19" font-weight="800" fill="#111111">CLOUD &amp; RELEASES</text><text x="494.0" y="426" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15.5" fill="#111111">Container deployments on</text><text x="494.0" y="448" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15.5" fill="#111111">Google Cloud. SemVer releases,</text><text x="494.0" y="470" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15.5" fill="#111111">changelogs, rollbacks and</text><text x="494.0" y="492" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15.5" fill="#111111">lean CI/CD.</text><line x1="792.0" y1="364" x2="792.0" y2="532" stroke="#111111"/><text x="808.0" y="400" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="44" font-weight="900" fill="#111111" letter-spacing="-1">06</text><text x="878.0" y="398" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="19" font-weight="800" fill="#111111">OBSERVABILITY &amp; DATA</text><text x="878.0" y="426" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15.5" fill="#111111">Prometheus, Grafana and Loki</text><text x="878.0" y="448" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15.5" fill="#111111">with low-noise alerts.</text><text x="878.0" y="470" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15.5" fill="#111111">PostgreSQL design, safe</text><text x="878.0" y="492" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15.5" fill="#111111">migrations, query tuning.</text><line x1="0" y1="354" x2="1200" y2="354" stroke="#111111"/>
  <rect x="0" y="544" width="1200" height="56" fill="#111111"/>
  <text x="24" y="578" font-family="'JetBrains Mono','IBM Plex Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="15" fill="#efece4">THE WHOLE LIFECYCLE:  DESIGN → BUILD → SECURE → SHIP → MONITOR → MAINTAIN</text>
</svg>